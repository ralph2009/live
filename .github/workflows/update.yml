name: 更新直播源

on:
  schedule:
    # 每天北京时间 04:21 自动更新（GitHub 用 UTC，20:21 UTC = 次日 04:21 北京时间）。
    # 特意错开整点：GitHub 整点的 cron 高峰负载大，任务经常被延迟甚至跳过。
    - cron: "21 20 * * *"
  workflow_dispatch:        # 支持在 Actions 页面手动点一下立即更新
  push:
    branches: [main]
    paths:                  # 改了配置或脚本就自动重跑一次
      - "config.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 跑一遍清洗规则自检
        run: python -m unittest discover -s tests -v

      - name: 下载、清洗并体检直播源
        run: python scripts/build.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "本次结果与上次一致，跳过提交"
          else
            git commit -m "chore: 更新直播源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 刷新 jsDelivr 缓存
        if: success()
        run: |
          files="live.m3u live.txt cctv-sat.m3u cctv-sat.txt channel-catalog.json channel-catalog.txt stats.json"
          for i in 1 2 3; do
            for f in $files; do
              curl -s -m 20 "https://purge.jsdelivr.net/gh/ralph2009/live@main/output/$f" > /dev/null || true
            done
            # jsDelivr 的新提交镜像有几分钟延迟，等一会儿再补刷
            [ "$i" = "3" ] || sleep 90
          done

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "### 直播源更新结果"
            echo ""
            if [ -f output/health-summary.json ]; then
              echo "**地址体检**"
              echo ""
              echo '```json'
              cat output/health-summary.json
              echo '```'
            fi
            echo "**整体统计**"
            echo ""
            echo '```json'
            cat output/stats.json 2>/dev/null || echo "{}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
